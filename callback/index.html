<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Código de autorización — Optimatiza</title>
<style>
  body{font-family:system-ui,sans-serif;background:#F6F1E8;color:#183F35;display:grid;place-items:center;min-height:100vh;margin:0;padding:24px}
  .card{background:#FFFDF8;border:1px solid #E2DAC7;border-radius:18px;padding:32px;max-width:560px;box-shadow:0 8px 24px rgba(24,63,53,.07)}
  code{display:block;background:#EFE8D9;border-radius:10px;padding:14px;margin:14px 0;word-break:break-all;font-size:14px}
  button{background:#183F35;color:#F6F1E8;border:none;border-radius:10px;padding:12px 22px;font-size:14px;font-weight:700;cursor:pointer}
  p{font-size:14px;line-height:1.6}
</style>
</head>
<body>
<div class="card">
  <h1 style="font-size:20px">Código de autorización</h1>
  <p id="msg">Leyendo el código de la URL…</p>
  <code id="code">—</code>
  <button id="copy" type="button">Copiar código</button>
  <p style="color:#5F6E66">Página técnica de Optimatiza para flujos OAuth. Pegue este código en el script que se lo pidió y cierre esta pestaña.</p>
</div>
<script>
  var q = new URLSearchParams(location.search);
  var code = q.get("code") || "";
  var el = document.getElementById("code");
  if (code) {
    el.textContent = code;
    document.getElementById("msg").textContent = "Autorización correcta. Copie el código:";
  } else {
    document.getElementById("msg").textContent = "No se encontró ningún código en la URL (" + (q.get("error_description") || q.get("error") || "sin parámetros") + ").";
  }
  document.getElementById("copy").addEventListener("click", function () {
    navigator.clipboard.writeText(code).then(function () {
      document.getElementById("copy").textContent = "Copiado";
    });
  });
</script>
</body>
</html>
