<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 160" role="img" aria-labelledby="intT intD">
<title id="intT">FIG. 3B / INT - Integraciones</title>
<desc id="intD">Plano tecnico apaisado. El sistema de ORIGEN suelta un dato al canal. El agente, de cuerpo entero detras del canal, lo escanea con su haz y baja el brazo derecho con un sello: al tocar el dato aparece el sello ocre, la compuerta se levanta y el dato sigue hasta el sistema de DESTINO, donde queda escrito el registro.</desc>
<style>
/* ============================================================
   VINETA: ENRUTAR EL DATO
   ORIGEN (izq) = CONTROL (centro) = DESTINO (der).
   El agente es el ROBOT CANONICO completo (cabeza, torso,
   brazos y base) a escala 0.42, de pie detras del canal.
   El canal es masa oscura #183F35 con filete claro #D3DED6:
   se lee como silueta sobre crema y como contorno sobre verde
   bosque. Cyan solo para el robot y su haz.
   ============================================================ */
.t{font-family:ui-monospace,'IBM Plex Mono',Menlo,Consolas,monospace;fill:#D3DED6;stroke:none}
.mass{fill:#183F35;stroke:#D3DED6;stroke-width:1.75}
.mass-s{fill:#183F35;stroke:#D3DED6;stroke-width:1.3}
.deep{fill:#12251F;stroke:#D3DED6;stroke-width:1.3}
.hair{fill:none;stroke:#D3DED6;stroke-width:1;opacity:.5}
.oc{fill:none;stroke:#C9913B;stroke-width:1}

/* = el canal: masa oscura con filete claro = */
.duct{fill:#183F35;stroke:#D3DED6;stroke-width:1.6}
.rail{fill:none;stroke:#2C7A63;stroke-width:1;opacity:.9}

/* = capa 3: recorrido continuo del canal (2.2s) = */
.flow{fill:none;stroke:#D3DED6;stroke-width:1.5;stroke-dasharray:7 9;opacity:.45;
      animation:flowRun 2.2s linear infinite}
@keyframes flowRun{to{stroke-dashoffset:-16}}

/* = capa 3: pilotos de cada sistema, dos ritmos distintos = */
.led{fill:#C9913B;animation:ledBlink 2.4s ease-in-out infinite}
.led2{animation-delay:.3s}
.led3{animation-delay:.6s}
@keyframes ledBlink{0%,100%{opacity:.25}50%{opacity:1}}
.ledB{animation-duration:3.2s}

/* = capa 3: globos de referencia (4.8s) = */
.bal{animation:balPulse 4.8s ease-in-out infinite}
.bal2{animation-delay:1.6s}
@keyframes balPulse{0%,100%{opacity:1}50%{opacity:.62}}

/* ===== ROBOT CANONICO COMPLETO, escala 0.42 =====
   Los trazos van engrosados porque a esta escala el contorno
   original quedaria por debajo de 1px y se perderia sobre crema.
   Las clases .h= son las piezas de la cabeza, que llevan un
   0.56 extra encima, asi que su trazo se engrosa 1.79x mas. */
.b-shell{fill:#FFFDF8;stroke:#183F35;stroke-width:3.6}
.b-metal{fill:#E3E9EC;stroke:#183F35;stroke-width:3.4}
.b-ring{fill:#C2CCD2;stroke:#183F35;stroke-width:2.8}
.b-screen{fill:#0C1A2B}
.b-cyan{fill:#20C8E4}
.b-limb-o{fill:none;stroke:#183F35;stroke-width:19;stroke-linecap:round}
.b-limb-i{fill:none;stroke:#E3E9EC;stroke-width:12.5;stroke-linecap:round}
.h-shell{fill:#FFFDF8;stroke:#183F35;stroke-width:6.4}
.h-metal{fill:#E3E9EC;stroke:#183F35;stroke-width:6}
.h-ring{fill:#C2CCD2;stroke:#183F35;stroke-width:5}
.tool-b{fill:#183F35;stroke:#D3DED6;stroke-width:3.4}
.tool-f{fill:#C9913B;stroke:#183F35;stroke-width:2}

.k-float{animation:kFloat 5.6s ease-in-out infinite}
@keyframes kFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
/* la base queda plantada mientras el cuerpo flota */
.b-wheel{animation:bWheel 5.6s ease-in-out infinite}
@keyframes bWheel{0%,100%{transform:translateY(0)}50%{transform:translateY(7px)}}
.k-aura{fill:#20C8E4;opacity:.1;transform-origin:120px 76px;
        animation:kBreathe 4.6s ease-in-out infinite}
@keyframes kBreathe{0%,100%{opacity:.07;transform:scale(1)}50%{opacity:.15;transform:scale(1.05)}}
.k-ballglow{fill:#20C8E4;opacity:.4;transform-origin:100px 16px;
            animation:kPing 2.6s ease-out infinite}
@keyframes kPing{0%{transform:scale(.65);opacity:.6}70%,100%{transform:scale(1.9);opacity:0}}
.b-led{fill:#20C8E4;animation:bLed 2.4s ease-in-out infinite}
.b-led-2{animation-delay:.35s}
.b-led-3{animation-delay:.7s}
@keyframes bLed{0%,100%{opacity:.3}50%{opacity:1}}
.b-bar{fill:#20C8E4;opacity:.8;animation:bBar 3.2s ease-in-out infinite}
.b-bar-1{transform-origin:99px 180px}
.b-bar-2{transform-origin:113px 180px;animation-delay:.4s}
.b-bar-3{transform-origin:127px 180px;animation-delay:.8s}
.b-bar-4{transform-origin:141px 180px;animation-delay:1.2s}
@keyframes bBar{0%,100%{transform:scaleY(.35)}50%{transform:scaleY(1)}}
.k-eyeL,.k-eyeR{animation:kBlink 4.2s ease-in-out infinite}
.k-eyeL{transform-origin:74px 115px}
.k-eyeR{transform-origin:126px 115px;animation-delay:.06s}
@keyframes kBlink{0%,45%{transform:scaleY(1)}47.5%,49.5%{transform:scaleY(.12)}52.5%,100%{transform:scaleY(1)}}
.k-glowL,.k-glowR{fill:#20C8E4;opacity:.26;animation:kBreathe 3s ease-in-out infinite}
.k-glowL{transform-origin:74px 115px}
.k-glowR{transform-origin:126px 115px}
/* el brazo izquierdo sostiene el borde del canal, ritmo propio 4.4s */
.k-armL{transform-origin:72px 130px;animation:kArmL 4.4s ease-in-out infinite}
@keyframes kArmL{0%,100%{transform:rotate(0deg)}50%{transform:rotate(-5deg)}}

/* ===== capa 1: el ciclo maestro de 9 s =====
   0=7 %   captura en el origen
   7=26 %  el dato viaja al punto de control
   26=44 % el agente lo escanea (haz + linea de lectura)
   44=52 % baja el brazo y estampa: aparece el sello
   52=60 % sube el brazo y la compuerta se levanta
   60=80 % el dato viaja al destino
   84 %    el registro queda escrito                        */
.pkt{animation:pktRun 9s linear infinite}
@keyframes pktRun{
  0%  {transform:translateX(0);opacity:0}
  3%  {transform:translateX(0);opacity:1}
  7%  {transform:translateX(0);opacity:1;animation-timing-function:cubic-bezier(.45,0,.15,1)}
  26% {transform:translateX(97px);opacity:1}
  60% {transform:translateX(97px);opacity:1;animation-timing-function:cubic-bezier(.45,0,.15,1)}
  80% {transform:translateX(170px);opacity:1}
  92% {transform:translateX(170px);opacity:1}
  96% {transform:translateX(170px);opacity:0}
  100%{transform:translateX(0);opacity:0}
}
/* el brazo derecho estampa; el sello nace en el mismo compas */
.k-armR{transform-origin:168px 130px;animation:kArm 9s ease-in-out infinite}
@keyframes kArm{
  0%,26% {transform:rotate(0deg)}
  36%    {transform:rotate(-6deg)}
  46%,52%{transform:rotate(9deg)}
  60%,100%{transform:rotate(0deg)}
}
.seal{transform-origin:3.5px 0;animation:sealOn 9s ease-out infinite}
@keyframes sealOn{
  0%,45%{opacity:0;transform:scale(.3)}
  49%   {opacity:1;transform:scale(1.4)}
  54%   {opacity:1;transform:scale(1)}
  92%   {opacity:1;transform:scale(1)}
  96%,100%{opacity:0;transform:scale(1)}
}
/* la compuerta se levanta despues del sello, no sola */
.gate{animation:gateUp 9s ease-in-out infinite}
@keyframes gateUp{
  0%,52%{transform:translateY(0)}
  60%,88%{transform:translateY(-18px)}
  95%,100%{transform:translateY(0)}
}
.gflash{fill:#C9913B;opacity:.2;animation:gateLamp 9s ease-out infinite}
@keyframes gateLamp{0%,50%{opacity:.2}56%,88%{opacity:1}94%,100%{opacity:.2}}
.cap{fill:#C9913B;opacity:.25;animation:capFlash 9s ease-out infinite}
@keyframes capFlash{0%{opacity:.9}8%{opacity:.4}22%,100%{opacity:.14}}
.dslot,.dcheck{animation:slotOn 9s linear infinite}
@keyframes slotOn{0%,78%{opacity:0}84%,97%{opacity:1}100%{opacity:0}}
.tagOk{animation:tagOn 9s ease-out infinite}
@keyframes tagOn{0%,44%{opacity:.5}53%,95%{opacity:1}100%{opacity:.5}}
/* la cabeza se inclina sobre el dato y la mirada lo sigue */
.k-nod{transform-origin:109px 112px;animation:kNod 9s ease-in-out infinite}
@keyframes kNod{
  0%,18% {transform:rotate(0deg)}
  28%,52%{transform:rotate(4deg)}
  62%    {transform:rotate(0deg)}
  74%,84%{transform:rotate(-3deg)}
  92%,100%{transform:rotate(0deg)}
}
.k-look{animation:kLook 9s ease-in-out infinite}
@keyframes kLook{
  0%,8%  {transform:translateX(-8px)}
  24%,54%{transform:translateX(8px)}
  80%,92%{transform:translateX(9px)}
  100%   {transform:translateX(-8px)}
}

/* = el haz de revision sale de los ojos; reposo visible = */
.cone{fill:#20C8E4;opacity:.1;animation:coneOn 9s ease-in-out infinite}
@keyframes coneOn{0%,20%{opacity:.06}26%,52%{opacity:.19}58%,100%{opacity:.06}}
/* la linea de lectura barre SOLO el ancho del dato y nunca
   se apaga del todo: anima traslacion, no visibilidad */
.scanline{fill:none;stroke:#20C8E4;stroke-width:1.6;stroke-linecap:round;opacity:.5;
          animation:scanSweep 9s ease-in-out infinite}
@keyframes scanSweep{
  0%,24%{transform:translateY(-4px);opacity:.28}
  28%   {transform:translateY(-4px);opacity:.95}
  36%   {transform:translateY(4px);opacity:.95}
  43%   {transform:translateY(-4px);opacity:.95}
  47%,100%{transform:translateY(-4px);opacity:.28}
}

@media (prefers-reduced-motion: reduce){
  *{animation:none !important}
  .pkt{transform:translateX(97px)}
  .seal{opacity:1;transform:scale(1)}
  .k-armR{transform:rotate(9deg)}
  .gate{transform:translateY(-18px)}
  .gflash{opacity:1}
  .tagOk{opacity:1}
  .dslot,.dcheck{opacity:1}
  .cap{opacity:.14}
  .cone{opacity:.16}
  .scanline{opacity:.6}
}
</style>

<!-- marco de plano y regleta de escala -->
<rect x="4" y="4" width="312" height="152" rx="3" fill="none" stroke="#C9913B" stroke-width="1" opacity=".55"/>
<path class="oc" opacity=".4" d="M20 4 v3.5 M52 4 v3.5 M84 4 v3.5 M116 4 v3.5 M148 4 v3.5 M180 4 v3.5 M212 4 v3.5 M244 4 v3.5 M276 4 v3.5"/>

<!-- cajetines de esquina: codigo y escala -->
<g>
  <rect class="mass-s" x="10" y="9" width="84" height="17" rx="2"/>
  <text class="t" x="52" y="20" text-anchor="middle" font-size="7" letter-spacing="1">FIG. 8 — INT</text>
  <rect class="mass-s" x="254" y="9" width="52" height="17" rx="2"/>
  <text class="t" x="280" y="20" text-anchor="middle" font-size="7" letter-spacing="1">ESC 1:1</text>
</g>

<!-- ===== EL AGENTE: robot canonico completo, escala 0.42 =====
     cuerpo y cabeza van DETRAS del canal; el brazo que estampa
     se dibuja mas abajo, por delante del dato. -->
<g class="k-float">
  <ellipse class="k-aura" cx="120" cy="76" rx="42" ry="48"/>
  <g transform="translate(70 24) scale(0.42)">
    <g class="b-wheel">
      <rect class="b-metal" x="82" y="218" width="76" height="24" rx="11"/>
      <circle class="b-metal" cx="98" cy="252" r="13"/>
      <circle class="b-metal" cx="120" cy="252" r="13"/>
      <circle class="b-metal" cx="142" cy="252" r="13"/>
      <circle class="b-ring" cx="98" cy="252" r="5"/>
      <circle class="b-ring" cx="120" cy="252" r="5"/>
      <circle class="b-ring" cx="142" cy="252" r="5"/>
    </g>

    <g class="k-armL">
      <path class="b-limb-o" d="M72 130 q-40 22 -44 50 q-2 8 -4 10"/>
      <path class="b-limb-i" d="M72 130 q-40 22 -44 50 q-2 8 -4 10"/>
      <circle class="b-shell" cx="24" cy="190" r="13"/>
      <circle class="b-cyan" cx="24" cy="190" r="5"/>
    </g>

    <rect class="b-shell" x="68" y="104" width="104" height="120" rx="34"/>
    <rect class="b-screen" x="86" y="132" width="68" height="56" rx="14"/>
    <circle class="b-led" cx="98" cy="146" r="3.6"/>
    <circle class="b-led b-led-2" cx="109" cy="146" r="3.6"/>
    <circle class="b-led b-led-3" cx="120" cy="146" r="3.6"/>
    <rect class="b-bar b-bar-1" x="95" y="160" width="9" height="20" rx="3"/>
    <rect class="b-bar b-bar-2" x="109" y="160" width="9" height="20" rx="3"/>
    <rect class="b-bar b-bar-3" x="123" y="160" width="9" height="20" rx="3"/>
    <rect class="b-bar b-bar-4" x="137" y="160" width="9" height="20" rx="3"/>
    <rect class="b-ring" x="96" y="200" width="48" height="8" rx="4"/>

    <g class="k-nod">
      <g transform="translate(53 2) scale(0.56)">
        <rect class="h-metal" x="2" y="94" width="38" height="54" rx="18"/>
        <rect class="h-metal" x="160" y="94" width="38" height="54" rx="18"/>
        <circle class="h-ring" cx="17" cy="121" r="11"/>
        <circle class="h-ring" cx="183" cy="121" r="11"/>
        <circle class="b-cyan" cx="17" cy="121" r="6.5"/>
        <circle class="b-cyan" cx="183" cy="121" r="6.5"/>

        <rect class="h-shell" x="24" y="44" width="152" height="150" rx="70"/>
        <rect class="b-screen" x="72" y="44" width="56" height="24" rx="10"/>
        <path d="M90 46 q10 -13 20 0 z" fill="#B6C1C7"/>
        <line x1="100" y1="42" x2="100" y2="27" stroke="#B6C1C7" stroke-width="6" stroke-linecap="round"/>
        <circle class="k-ballglow" cx="100" cy="16" r="11"/>
        <circle class="b-cyan" cx="100" cy="16" r="11"/>
        <circle cx="96.5" cy="12.5" r="3.4" fill="#EAFAFF"/>

        <rect class="b-screen" x="40" y="70" width="120" height="98" rx="35"/>
        <circle class="k-glowL" cx="74" cy="115" r="24"/>
        <circle class="k-glowR" cx="126" cy="115" r="24"/>
        <g class="k-eyeL">
          <circle class="b-cyan" cx="74" cy="115" r="17"/>
          <g class="k-look">
            <circle cx="74" cy="115" r="9" fill="#06131F"/>
            <circle cx="78.5" cy="110.5" r="3.4" fill="#EAFAFF"/>
          </g>
        </g>
        <g class="k-eyeR">
          <circle class="b-cyan" cx="126" cy="115" r="17"/>
          <g class="k-look">
            <circle cx="126" cy="115" r="9" fill="#06131F"/>
            <circle cx="130.5" cy="110.5" r="3.4" fill="#EAFAFF"/>
          </g>
        </g>
        <path d="M85 145 q15 13 30 0" fill="none" stroke="#20C8E4" stroke-width="7" stroke-linecap="round"/>
        <rect class="h-metal" x="74" y="176" width="52" height="18" rx="7"/>
        <rect class="b-cyan" x="86" y="183" width="28" height="4" rx="2"/>
      </g>
    </g>
  </g>
  <!-- el haz arranca en los ojos, no debajo de la barbilla -->
  <path class="cone" d="M109 54 H123 L196 104 H162 Z"/>
</g>

<!-- SISTEMA DE ORIGEN -->
<g>
  <rect class="mass" x="10" y="90" width="62" height="46" rx="4"/>
  <line class="hair" x1="10" y1="104" x2="72" y2="104"/>
  <text class="t" x="38" y="100" text-anchor="middle" font-size="7" letter-spacing="1.1">ORIGEN</text>
  <rect class="led" x="52" y="93.5" width="3.4" height="3.4"/>
  <rect class="led led2" x="57.5" y="93.5" width="3.4" height="3.4"/>
  <rect class="led led3" x="63" y="93.5" width="3.4" height="3.4"/>
  <rect class="cap" x="16" y="108" width="38" height="6" rx="2"/>
  <rect class="hair" x="16" y="108" width="38" height="6" rx="2"/>
  <rect class="hair" x="16" y="117" width="38" height="6" rx="2"/>
  <rect class="hair" x="16" y="126" width="38" height="6" rx="2"/>
</g>

<!-- SISTEMA DE DESTINO -->
<g>
  <rect class="mass" x="254" y="90" width="56" height="46" rx="4"/>
  <line class="hair" x1="254" y1="104" x2="310" y2="104"/>
  <text class="t" x="281" y="100" text-anchor="middle" font-size="6.6" letter-spacing="1">DESTINO</text>
  <rect class="led ledB" x="293" y="93.5" width="3.4" height="3.4"/>
  <rect class="led ledB led2" x="298.5" y="93.5" width="3.4" height="3.4"/>
  <rect class="led ledB led3" x="304" y="93.5" width="3.4" height="3.4"/>
  <rect class="hair" x="261" y="108" width="33" height="6" rx="2"/>
  <rect class="hair" x="261" y="117" width="33" height="6" rx="2"/>
  <rect class="hair" x="261" y="126" width="33" height="6" rx="2"/>
  <rect class="dslot" x="261" y="117" width="33" height="6" rx="2" fill="#D3DED6"/>
  <path class="dcheck" d="M298 120 l3 3.5 l6 -8" fill="none" stroke="#D3DED6" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
</g>

<!-- EL CANAL: masa oscura con filete claro y su recorrido -->
<rect class="duct" x="74" y="106" width="178" height="18" rx="2"/>
<path class="rail" d="M78 109.5 H248 M78 120.5 H248"/>
<path class="flow" d="M78 115 H248"/>
<path d="M238 115 l-8 -4 v8 Z" fill="#D3DED6" opacity=".8"/>

<!-- bocas de conexion de cada sistema -->
<g>
  <rect class="deep" x="66" y="108" width="10" height="14" rx="1.5"/>
  <path class="oc" d="M67 114 l6 -6 M67 120 l6.5 -6.5"/>
  <rect class="deep" x="250" y="108" width="10" height="14" rx="1.5"/>
  <path class="oc" d="M259 114 l-6 -6 M259 120 l-6.5 -6.5"/>
</g>

<!-- PUNTO DE CONTROL: ventana marcada, rotulo y compuerta -->
<g>
  <path class="oc" opacity=".5" d="M159 104 V126 M191 104 V126"/>
  <rect class="mass" x="150" y="127" width="52" height="12" rx="2"/>
  <text class="t" x="176" y="135.6" text-anchor="middle" font-size="6.4" letter-spacing="1">CONTROL</text>
  <rect class="mass-s" x="194" y="88" width="12" height="18" rx="2"/>
  <rect class="gflash" x="196.5" y="91" width="7" height="4" rx="1"/>
  <g class="gate">
    <rect x="196" y="105" width="8" height="20" rx="1.5" fill="#183F35" stroke="#D3DED6" stroke-width="1.2"/>
    <line x1="200" y1="109" x2="200" y2="121" stroke="#C9913B" stroke-width="1" opacity=".6"/>
  </g>
</g>

<!-- EL DATO QUE VIAJA -->
<g transform="translate(78 115)">
  <g class="pkt">
    <rect x="-11" y="-6" width="22" height="12" rx="2.5" fill="#D3DED6" stroke="#183F35" stroke-width="1.4"/>
    <path d="M-7.5 -2.4 h7 M-7.5 1.4 h5" fill="none" stroke="#183F35" stroke-width="1" opacity=".55" stroke-linecap="round"/>
    <circle class="seal" cx="3.5" cy="0" r="3.4" fill="#C9913B" stroke="#183F35" stroke-width="0.9"/>
  </g>
</g>

<!-- linea de lectura: barre solo el ancho del dato -->
<line class="scanline" x1="165" y1="115" x2="185" y2="115"/>

<!-- BRAZO QUE ESTAMPA: por delante del canal y del dato -->
<g class="k-float">
  <g transform="translate(70 24) scale(0.42)">
    <g class="k-armR">
      <path class="b-limb-o" d="M168 130 q54 -12 70 6 q12 10 24 24"/>
      <path class="b-limb-i" d="M168 130 q54 -12 70 6 q12 10 24 24"/>
      <rect class="tool-b" x="246" y="164" width="32" height="20" rx="3"/>
      <rect class="tool-f" x="240" y="184" width="44" height="9" rx="2"/>
      <circle class="b-shell" cx="262" cy="160" r="13"/>
      <circle class="b-cyan" cx="262" cy="160" r="5"/>
    </g>
  </g>
</g>

<!-- rotulo de estado: el dato sale sellado -->
<g class="tagOk">
  <rect class="mass-s" x="212" y="90" width="34" height="12" rx="2"/>
  <text class="t" x="229" y="98.4" text-anchor="middle" font-size="5.6" letter-spacing=".7">SELLADO</text>
</g>

<!-- globos de referencia -->
<g class="bal">
  <line class="oc" x1="76" y1="78" x2="66" y2="90"/>
  <circle class="mass-s" cx="80" cy="72" r="6.5"/>
  <text class="t" x="80" y="74.7" text-anchor="middle" font-size="7.5">1</text>
</g>
<g class="bal bal2">
  <line class="oc" x1="240" y1="72" x2="256" y2="88"/>
  <circle class="mass-s" cx="236" cy="66" r="6.5"/>
  <text class="t" x="236" y="68.7" text-anchor="middle" font-size="7.5">2</text>
</g>

<!-- cota inferior -->
<g class="oc">
  <line x1="20" y1="141" x2="20" y2="153"/>
  <line x1="300" y1="141" x2="300" y2="153"/>
  <line x1="20" y1="147" x2="300" y2="147"/>
</g>
<path d="M20 147 l8 -2.5 v5 Z M300 147 l-8 -2.5 v5 Z" fill="#C9913B"/>
<rect x="34" y="141" width="90" height="13" fill="#183F35"/>
<text class="t" x="79" y="150.2" text-anchor="middle" font-size="6.6" letter-spacing="1">UNA SOLA CAPTURA</text>
</svg>
