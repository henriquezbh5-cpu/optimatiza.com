<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 280" role="img" aria-labelledby="altT altD">
  <title id="altT">Un agente en su puesto de vigilancia levanta una baliza que emite señal; junto a él una ficha marca el umbral cruzado y a quién le toca actuar</title>
  <desc id="altD">Plano tecnico vertical. Un robot pequeño sostiene en alto una baliza ocre que emite anillos de señal. A su derecha, montada en un poste, una ficha muestra una barra que cruza su umbral, el responsable y la accion ya acordada.</desc>
  <!-- ============================================================
       ALT=03  =  ALERTAR
       Cadena de una sola lectura: el dato sube por el poste, la
       barra de la ficha cruza el umbral y se vuelve ocre, el robot
       levanta la baliza y la barre, los anillos salen, y la ficha
       enciende responsable, nombre y accion acordada.
       Ciclo maestro 9s. Ritmos independientes: anillos 3.6s,
       halo de la baliza 2.6s, flotacion del robot 5.6s, parpadeo
       4.2s, leds 2.4s, barras del pecho 3.2s, aura 4.6s.
       Estado de reposo (sin animacion) = ciclo terminado.
       Doble fondo: masas #183F35 con trazo claro, filetes tecnicos
       en verde medio #2C7A63 para que se lean sobre crema Y sobre
       verde bosque. Cyan reservado al robot.
       ============================================================ -->
  <style>
    .alt-mono { font-family:'IBM Plex Mono', ui-monospace, Menlo, monospace }
    .alt-hair { fill:none; stroke:#2C7A63; stroke-width:1; stroke-linecap:round; stroke-linejoin:round }
    .alt-mass { fill:#183F35; stroke:#D3DED6; stroke-width:1.5; stroke-linejoin:round }
    .alt-fine { fill:none; stroke:rgba(211,222,214,.38); stroke-width:1 }

    /* ===== capa 1 : el brazo levanta y barre la baliza (9s) ===== */
    .alt-arm  { transform-origin:168px 130px; transform:rotate(-1deg);
                animation:altSweep 9s cubic-bezier(.4,0,.3,1) infinite }
    .alt-armg { transform-origin:105.32px 153.95px; transform:rotate(-1deg);
                animation:altSweep 9s cubic-bezier(.4,0,.3,1) infinite }
    @keyframes altSweep {
      0%,16%   { transform:rotate(-1deg) }
      24%      { transform:rotate(-6deg) }
      32%      { transform:rotate(4deg) }
      40%      { transform:rotate(-4deg) }
      48%      { transform:rotate(2deg) }
      58%,100% { transform:rotate(-1deg) }
    }
    /* la baliza vive fuera del grupo escalado: repite la flotacion */
    .alt-floatg { animation:altFloatG 5.6s ease-in-out infinite }
    @keyframes altFloatG { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-3.69px)} }

    /* ===== capa 2 : la lampara y sus anillos ===== */
    .alt-lens { fill:#C9913B; animation:altLens 9s ease-in-out infinite }
    @keyframes altLens { 0%,14%{opacity:.4} 22%,62%{opacity:1} 80%,100%{opacity:.85} }
    .alt-halo { fill:#C9913B; opacity:.28; transform-origin:122.5px 69px;
                animation:altHalo 2.6s ease-in-out infinite }
    @keyframes altHalo { 0%,100%{opacity:.10;transform:scale(.72)} 50%{opacity:.32;transform:scale(1.14)} }

    .alt-ring { fill:none; stroke:#C9913B; stroke-width:1.9; stroke-linecap:round; opacity:.5;
                transform-origin:122.5px 71px; animation:altRing 3.6s ease-out infinite }
    @keyframes altRing {
      0%   { transform:scale(.32); opacity:0 }
      14%  { opacity:.95 }
      62%  { opacity:.5 }
      100% { transform:scale(1.3);  opacity:0 }
    }
    .alt-r1 { transform:scale(.55) }
    .alt-r2 { transform:scale(.85); animation-delay:-1.2s }
    .alt-r3 { transform:scale(1.15); animation-delay:-2.4s }

    /* ===== capa 3 : la ficha se transforma (9s, mismo compas) ===== */
    .alt-up { fill:#C9913B; transform:translateY(-34px); opacity:.9;
              animation:altUp 9s cubic-bezier(.3,0,.3,1) infinite }
    @keyframes altUp {
      0%   { transform:translateY(0);     opacity:0 }
      4%   { opacity:1 }
      14%  { transform:translateY(-34px); opacity:1 }
      24%,100% { transform:translateY(-34px); opacity:.35 }
    }
    .alt-bar { fill:#C9913B; transform-origin:157.3px 126px; transform:scaleX(.87);
               animation:altBar 9s cubic-bezier(.4,0,.3,1) infinite }
    @keyframes altBar {
      0%       { transform:scaleX(.18); fill:#2C7A63 }
      10%      { transform:scaleX(.42); fill:#2C7A63 }
      16%      { transform:scaleX(.63); fill:#2C7A63 }
      20%      { transform:scaleX(.72); fill:#C9913B }
      27%      { transform:scaleX(.81); fill:#C9913B }
      40%,100% { transform:scaleX(.87); fill:#C9913B }
    }
    .alt-flash { fill:none; stroke:#C9913B; stroke-width:1.9; opacity:.45;
                 animation:altFlash 9s ease-out infinite }
    @keyframes altFlash { 0%,17%{opacity:0} 21%{opacity:1} 34%,100%{opacity:.45} }
    .alt-alert { fill:#C9913B; animation:altAlert 9s ease-in-out infinite }
    @keyframes altAlert { 0%,17%{opacity:.16} 21%,100%{opacity:1} }
    .alt-alerth { fill:#C9913B; opacity:.3; transform-origin:213px 98px;
                  animation:altPing 2.4s ease-out infinite }
    @keyframes altPing { 0%{transform:scale(.5);opacity:.55} 70%,100%{transform:scale(1.9);opacity:0} }
    .alt-chip { fill:#2C7A63; transform-origin:174px 167.7px;
                animation:altChip 9s ease-out infinite }
    @keyframes altChip { 0%,36%{opacity:.15;transform:scaleX(.08)} 44%,100%{opacity:1;transform:scaleX(1)} }
    .alt-check { fill:none; stroke:#C9913B; stroke-width:2.4; stroke-linecap:round; stroke-linejoin:round;
                 stroke-dasharray:18; stroke-dashoffset:0;
                 animation:altCheck 9s ease-out infinite }
    @keyframes altCheck { 0%,48%{stroke-dashoffset:18;opacity:.2} 58%,100%{stroke-dashoffset:0;opacity:1} }
    .alt-act { animation:altAct 9s ease-in-out infinite }
    @keyframes altAct { 0%,56%{opacity:.2} 64%,100%{opacity:1} }

    /* ===== el robot mira hacia la senal ===== */
    .alt-head { transform-origin:120px 112px; transform:rotate(6deg);
                animation:altLook 9s ease-in-out infinite }
    @keyframes altLook { 0%,12%{transform:rotate(3deg)} 24%,60%{transform:rotate(8deg)} 76%,100%{transform:rotate(3deg)} }
    .alt-pupil { transform:translate(7px,-4px) }

    /* ===== robot canonico ===== */
    .b-cyan  { fill:#20C8E4 }
    .b-shell { fill:#FFFDF8; stroke:#183F35; stroke-width:2.4 }
    .b-screen{ fill:#0C1A2B }
    .b-metal { fill:#E3E9EC; stroke:#183F35; stroke-width:2.2 }
    .b-ring  { fill:#C2CCD2; stroke:#183F35; stroke-width:1.8 }
    .b-limb-o{ fill:none; stroke:#183F35; stroke-width:17; stroke-linecap:round }
    .b-limb-i{ fill:none; stroke:#E3E9EC; stroke-width:12.5; stroke-linecap:round }

    .b-float { animation:bFloat 5.6s ease-in-out infinite }
    @keyframes bFloat { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-6px)} }
    .b-aura { fill:#20C8E4; opacity:.10; transform-origin:120px 140px;
              animation:bBreathe 4.6s ease-in-out infinite }
    @keyframes bBreathe { 0%,100%{opacity:.07;transform:scale(1)} 50%{opacity:.15;transform:scale(1.04)} }
    /* origenes en coordenadas locales del grupo de la cabeza */
    .b-ballglow { fill:#20C8E4; opacity:.4; transform-origin:100px 16px;
                  animation:bPing 2.2s ease-out infinite }
    @keyframes bPing { 0%{transform:scale(.65);opacity:.6} 70%,100%{transform:scale(1.8);opacity:0} }
    .b-eyeL,.b-eyeR { animation:bBlink 4.2s ease-in-out infinite }
    .b-eyeL { transform-origin:74px 115px }
    .b-eyeR { transform-origin:126px 115px; animation-delay:.06s }
    @keyframes bBlink { 0%,45%,100%{transform:scaleY(1)} 48%,51%{transform:scaleY(.12)} }
    .b-glowL,.b-glowR { fill:#20C8E4; opacity:.26; animation:bBreathe 3s ease-in-out infinite }
    .b-glowL { transform-origin:74px 115px }
    .b-glowR { transform-origin:126px 115px }
    .b-led { fill:#20C8E4; animation:bLed 2.4s ease-in-out infinite }
    .b-led-2 { animation-delay:.35s }
    .b-led-3 { animation-delay:.7s }
    @keyframes bLed { 0%,100%{opacity:.25} 50%{opacity:1} }
    .b-bar { fill:#20C8E4; opacity:.8; animation:bBar 3.2s ease-in-out infinite }
    .b-bar-1 { transform-origin:99px 180px }
    .b-bar-2 { transform-origin:113px 180px; animation-delay:.4s }
    .b-bar-3 { transform-origin:127px 180px; animation-delay:.8s }
    .b-bar-4 { transform-origin:141px 180px; animation-delay:1.2s }
    @keyframes bBar { 0%,100%{transform:scaleY(.35)} 50%{transform:scaleY(1)} }
    .b-armL { transform-origin:72px 130px; animation:bArmL 4.4s ease-in-out infinite }
    @keyframes bArmL { 0%,100%{transform:rotate(0deg)} 50%{transform:rotate(-11deg)} }
    .b-wheel { animation:bWheel 5.6s ease-in-out infinite }
    @keyframes bWheel { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-3px)} }

    @media (prefers-reduced-motion: reduce) { * { animation:none !important } }
  </style>

  <defs>
    <pattern id="altH" patternUnits="userSpaceOnUse" width="5" height="5" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="5" stroke="rgba(44,122,99,.55)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- ===== marco de plano ===== -->
  <rect x="12" y="12" width="216" height="256" fill="none" stroke="#2C7A63" stroke-width="1" opacity=".45"/>
  <path class="alt-hair" opacity=".8" d="M18 30 V18 H30 M210 18 H222 V30 M222 250 V262 H210 M30 262 H18 V250"/>

  <!-- ===== rotulo ===== -->
  <rect x="64" y="19" width="112" height="17" rx="3" fill="#183F35" stroke="#2C7A63" stroke-width="1"/>
  <text class="alt-mono" x="120" y="31.2" text-anchor="middle" font-size="7.5" letter-spacing="2" fill="#D3DED6">FIG. 7 &#8212; ALT-03</text>
  <path class="alt-hair" opacity=".55" d="M28 27.5 H60 M180 27.5 H212"/>

  <!-- ===== suelo ===== -->
  <path d="M20 238 H214" fill="none" stroke="#2C7A63" stroke-width="1.6" stroke-linecap="round"/>
  <ellipse cx="76" cy="241" rx="38" ry="4.5" fill="url(#altH)"/>

  <!-- ===== poste del puesto de vigilancia ===== -->
  <rect class="alt-mass" x="183" y="190" width="8" height="42" rx="2"/>
  <rect class="alt-mass" x="171" y="232" width="32" height="6" rx="2"/>
  <path d="M187 230 V193" fill="none" stroke="rgba(211,222,214,.4)" stroke-width="1" stroke-dasharray="3 3"/>
  <circle class="alt-up" cx="187" cy="228" r="2.6"/>

  <!-- ===== ROBOT ALT-03 ===== -->
  <g transform="translate(2 74) scale(0.615)">
    <g class="b-float">
      <ellipse class="b-aura" cx="120" cy="140" rx="96" ry="118"/>

      <g class="b-wheel">
        <rect class="b-metal" x="82" y="218" width="76" height="24" rx="11"/>
        <circle class="b-metal" cx="98"  cy="252" r="13"/>
        <circle class="b-metal" cx="120" cy="252" r="13"/>
        <circle class="b-metal" cx="142" cy="252" r="13"/>
        <circle class="b-ring"  cx="98"  cy="252" r="5"/>
        <circle class="b-ring"  cx="120" cy="252" r="5"/>
        <circle class="b-ring"  cx="142" cy="252" r="5"/>
      </g>

      <g class="b-armL">
        <path class="b-limb-o" d="M72 130 q-32 8 -38 42 q-5 22 4 34"/>
        <path class="b-limb-i" d="M72 130 q-32 8 -38 42 q-5 22 4 34"/>
        <circle class="b-shell" cx="40" cy="210" r="13"/>
        <circle class="b-cyan"  cx="40" cy="210" r="5"/>
      </g>

      <!-- brazo derecho en alto: sostiene la baliza -->
      <g class="alt-arm">
        <path class="b-limb-o" d="M168 130 q30 -6 36 -34 q5 -24 -8 -46"/>
        <path class="b-limb-i" d="M168 130 q30 -6 36 -34 q5 -24 -8 -46"/>
        <circle class="b-shell" cx="196" cy="46" r="13"/>
        <circle class="b-cyan"  cx="196" cy="46" r="5"/>
      </g>

      <rect class="b-shell" x="68" y="104" width="104" height="120" rx="34"/>
      <rect class="b-screen" x="86" y="132" width="68" height="56" rx="14"/>
      <circle class="b-led"         cx="98"  cy="146" r="3.6"/>
      <circle class="b-led b-led-2" cx="109" cy="146" r="3.6"/>
      <circle class="b-led b-led-3" cx="120" cy="146" r="3.6"/>
      <rect class="b-bar b-bar-1" x="95"  y="160" width="9" height="20" rx="3"/>
      <rect class="b-bar b-bar-2" x="109" y="160" width="9" height="20" rx="3"/>
      <rect class="b-bar b-bar-3" x="123" y="160" width="9" height="20" rx="3"/>
      <rect class="b-bar b-bar-4" x="137" y="160" width="9" height="20" rx="3"/>
      <rect class="b-ring" x="96" y="200" width="48" height="8" rx="4"/>

      <g class="alt-head">
        <g transform="translate(53 2) scale(0.56)">
          <rect class="b-metal" x="2"   y="94" width="38" height="54" rx="18"/>
          <rect class="b-metal" x="160" y="94" width="38" height="54" rx="18"/>
          <circle class="b-ring" cx="17"  cy="121" r="11"/>
          <circle class="b-ring" cx="183" cy="121" r="11"/>
          <circle class="b-cyan" cx="17"  cy="121" r="6.5"/>
          <circle class="b-cyan" cx="183" cy="121" r="6.5"/>

          <rect class="b-shell" x="24" y="44" width="152" height="150" rx="70"/>
          <rect class="b-screen" x="72" y="44" width="56" height="24" rx="10"/>
          <path d="M90 46 q10 -13 20 0 z" fill="#B6C1C7"/>
          <line x1="100" y1="42" x2="100" y2="27" stroke="#B6C1C7" stroke-width="3.6" stroke-linecap="round"/>
          <circle class="b-ballglow" cx="100" cy="16" r="11"/>
          <circle class="b-cyan" cx="100" cy="16" r="11"/>
          <circle cx="96.5" cy="12.5" r="3.4" fill="#EAFAFF"/>

          <rect class="b-screen" x="40" y="70" width="120" height="98" rx="35"/>
          <circle class="b-glowL" cx="74"  cy="115" r="24"/>
          <circle class="b-glowR" cx="126" cy="115" r="24"/>
          <g class="b-eyeL">
            <circle class="b-cyan" cx="74" cy="115" r="17"/>
            <g class="alt-pupil">
              <circle cx="74" cy="115" r="9" fill="#06131F"/>
              <circle cx="78.5" cy="110.5" r="3.6" fill="#EAFAFF"/>
            </g>
          </g>
          <g class="b-eyeR">
            <circle class="b-cyan" cx="126" cy="115" r="17"/>
            <g class="alt-pupil">
              <circle cx="126" cy="115" r="9" fill="#06131F"/>
              <circle cx="130.5" cy="110.5" r="3.6" fill="#EAFAFF"/>
            </g>
          </g>
          <path d="M85 145 q15 13 30 0" fill="none" stroke="#20C8E4" stroke-width="4.2" stroke-linecap="round"/>
          <rect class="b-metal" x="74" y="176" width="52" height="18" rx="7"/>
          <rect class="b-cyan" x="86" y="183" width="28" height="4" rx="2"/>
        </g>
      </g>
    </g>
  </g>

  <!-- ===== baliza y anillos: pegados a la mano ===== -->
  <g class="alt-floatg">
    <g class="alt-armg">
      <path class="alt-ring alt-r1" d="M145.13 48.37 A32 32 0 0 1 145.13 93.63"/>
      <path class="alt-ring alt-r2" d="M145.13 48.37 A32 32 0 0 1 145.13 93.63"/>
      <path class="alt-ring alt-r3" d="M145.13 48.37 A32 32 0 0 1 145.13 93.63"/>

      <circle cx="122.5" cy="48.8" r="2.1" fill="#183F35" stroke="#D3DED6" stroke-width="1.2"/>
      <path d="M122.5 50.9 V53.2" fill="none" stroke="#D3DED6" stroke-width="1.3" stroke-linecap="round"/>
      <rect x="116" y="53.2" width="13" height="5.6" rx="2" fill="#183F35" stroke="#D3DED6" stroke-width="1.3"/>
      <circle class="alt-halo" cx="122.5" cy="69" r="13"/>
      <path class="alt-lens" d="M114.6 79 V66.5 Q114.6 58.6 122.5 58.6 Q130.4 58.6 130.4 66.5 V79 Z"
            stroke="#183F35" stroke-width="1.4" stroke-linejoin="round"/>
      <path d="M115.4 68.6 H129.6 M115.6 73.6 H129.4" fill="none" stroke="#183F35" stroke-width="1.2" opacity=".5"/>
      <rect class="alt-mass" x="112.4" y="78" width="20.2" height="6.4" rx="2"/>
      <rect x="120.2" y="83" width="4.6" height="16" rx="2.3" fill="#183F35" stroke="#D3DED6" stroke-width="1.3"/>
    </g>
  </g>

  <!-- ===== ficha: umbral cruzado y a quien le toca ===== -->
  <g>
    <rect class="alt-mass" x="150" y="88" width="74" height="102" rx="4"/>

    <rect x="152.5" y="90.5" width="69" height="15" rx="2" fill="#12251F"/>
    <text class="alt-mono" x="157" y="101.6" font-size="7.5" letter-spacing="1.2" fill="#D3DED6">UMBRAL</text>
    <circle class="alt-alerth" cx="213" cy="98" r="6.2"/>
    <circle class="alt-alert"  cx="213" cy="98" r="3.4"/>
    <path class="alt-fine" d="M150 108 H224"/>

    <path d="M194 113 H201.4 L197.7 118 Z" fill="#D3DED6"/>
    <rect x="156" y="121" width="62" height="10" rx="3" fill="#12251F" stroke="rgba(211,222,214,.3)" stroke-width="1"/>
    <rect class="alt-bar" x="157.3" y="122.3" width="59.4" height="7.4" rx="2.2"/>
    <path d="M197.7 117 V133" fill="none" stroke="#D3DED6" stroke-width="1" stroke-dasharray="2.5 2.5"/>
    <path class="alt-fine" d="M156 134 V137 M177 134 V136 M197.7 134 V138.5 M218 134 V137"/>
    <path class="alt-fine" d="M150 148 H224"/>

    <circle cx="162" cy="162" r="4.4" fill="#12251F" stroke="#D3DED6" stroke-width="1.3"/>
    <path d="M155.4 172.4 a6.6 6.6 0 0 1 13.2 0 Z" fill="#12251F" stroke="#D3DED6" stroke-width="1.3" stroke-linejoin="round"/>
    <text class="alt-mono" x="174" y="160" font-size="6.6" letter-spacing=".6" fill="#D3DED6">A CARGO</text>
    <rect class="alt-chip" x="174" y="165" width="30" height="5.5" rx="2.75"/>
    <path class="alt-check" d="M208 160 l3.4 3.4 l7.4 -8.8"/>

    <rect x="156" y="176" width="62" height="9" rx="4.5" fill="#12251F" stroke="rgba(211,222,214,.3)" stroke-width="1"/>
    <path d="M161 180.5 H172 M176 180.5 H188" fill="none" stroke="rgba(211,222,214,.45)" stroke-width="1.4" stroke-linecap="round"/>
    <path class="alt-act" d="M197 177.5 l4.5 3 l-4.5 3" fill="none" stroke="#C9913B" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path class="alt-act" d="M206 180.5 H212.5" fill="none" stroke="#C9913B" stroke-width="1.5" stroke-linecap="round"/>

    <rect class="alt-flash" x="150" y="88" width="74" height="102" rx="4"/>
  </g>

  <!-- ===== cajetin ===== -->
  <rect x="116" y="244" width="92" height="17" fill="#12251F" stroke="#2C7A63" stroke-width="1"/>
  <path d="M162 244 V261" fill="none" stroke="#2C7A63" stroke-width="1"/>
  <text class="alt-mono" x="122" y="256" font-size="7" letter-spacing=".6" fill="#D3DED6">ALT-03</text>
  <text class="alt-mono" x="168" y="256" font-size="7" letter-spacing=".6" fill="#D3DED6">ESC 1:4</text>
</svg>
